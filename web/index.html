<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>Claude 存档</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ececec' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M12 3v18M3 12h18M5.9 5.9l12.2 12.2M18.1 5.9L5.9 18.1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#scroller">跳到对话内容</a>

<div class="app" data-sidebar="open">

  <aside class="sidebar" aria-label="对话列表">
    <div class="sb-head">
      <span class="logo">
        <span class="logo-mark" id="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">Claude</span>
      </span>
      <span class="logo-sub">本地存档</span>
      <button class="icon-btn sb-collapse" id="sb-collapse" type="button"
              title="收起侧栏" aria-label="收起侧栏"></button>
    </div>
    <nav class="sb-body" id="sb-body"></nav>
    <div class="sb-foot" id="sb-foot"></div>
  </aside>

  <main class="main">
    <div class="banner">
      <span class="banner-icon" id="banner-icon" aria-hidden="true"></span>
      <span class="banner-text" id="banner-text">正在读取本地存档…</span>
    </div>

    <header class="topbar" id="topbar" data-scrolled="false"></header>

    <div class="reading">
      <div class="scroller" id="scroller" tabindex="-1">
        <div class="thread" id="thread"></div>
      </div>
      <div class="rail" id="rail" hidden aria-hidden="true"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="searchform" role="search">
        <label class="sr-only" for="search">搜索全部对话</label>
        <div class="composer-field">
          <input id="search" type="text" autocomplete="off" spellcheck="false"
                 placeholder="搜索对话…">
        </div>
        <button class="icon-btn" id="clear-search" type="button" hidden title="清除搜索" aria-label="清除搜索"></button>
        <button class="send" id="send-btn" type="submit" aria-label="打开第一个结果"></button>
      </form>
      <div class="composer-foot">
        <span class="foot-hint">只读 · 数据全部在这台设备上 · ⌘K 搜索</span>
        <span class="foot-stats" id="foot-stats"></span>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel" hidden aria-label="产物">
    <header class="panel-head">
      <div class="panel-heading">
        <span class="panel-kind" id="panel-kind"></span>
        <h2 class="panel-title" id="panel-title"></h2>
        <p class="panel-meta" id="panel-meta"></p>
      </div>
      <div class="panel-actions" id="panel-actions"></div>
    </header>
    <div class="panel-tabs" id="panel-tabs" hidden></div>
    <div class="panel-body" id="panel-body"></div>
    <footer class="panel-foot" id="panel-foot" hidden></footer>
  </aside>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
